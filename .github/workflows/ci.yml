name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      webgpu:
        description: Run the WebGPU hardware job (needs a GPU runner)
        type: boolean
        default: false

permissions:
  contents: read

env:
  BGT_E2E_PORT: '5278'

jobs:
  lint_js:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BGT_CI_LIGHT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - name: Private asset leak check
        run: npm run leakcheck
      - name: Negative check — leak check must reject a committed original/ file
        run: |
          mkdir -p original && echo "fake game" > original/CANARY.EXE
          git add -f original/CANARY.EXE
          if node tools/report/leakcheck.mjs --staged; then echo "leakcheck failed to block original/"; exit 1; fi
          git rm -q --cached original/CANARY.EXE && rm original/CANARY.EXE
      - run: npm run doctor
      - run: npm run typecheck
      - run: npx eslint .

  lint_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Native clang/GCC warning gate
        run: |
          node tools/build/check-host-gcc.mjs
          node --input-type=module -e "import {checkHostGcc} from './tools/build/check-host-gcc.mjs'; checkHostGcc('clang')"

  lint_examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - name: All example check-builds
        run: node tools/build/build.mjs --examples --check

  unit_1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BGT_CI_LIGHT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests — deterministic shard 1 of 2
        shell: bash
        run: |
          mapfile -t files < <({ find tests/unit -type f -name '*.test.ts' ! -name 'build-chunks.test.ts'; printf '%s\n' tests/oracle/tooling.test.ts tests/oracle/failures.test.ts; } | sort | awk 'NR % 2 == 1')
          npm test -- "${files[@]}" --maxWorkers=1

  unit_2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BGT_CI_LIGHT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests — deterministic shard 2 of 2
        shell: bash
        run: |
          mapfile -t files < <({ find tests/unit -type f -name '*.test.ts' ! -name 'build-chunks.test.ts'; printf '%s\n' tests/oracle/tooling.test.ts tests/oracle/failures.test.ts; } | sort | awk 'NR % 2 == 0')
          npm test -- "${files[@]}" --maxWorkers=1

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BGT_CI_LIGHT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wasm sample build
        run: npm run build:examples
      - name: Browser E2E (WebGL 2 fallback, software rendering)
        run: BGT_SOFTWARE_RENDERER=1 BGT_RESULTS_PREFIX=e2e npx playwright test --project=chromium-webgl2 --project=chromium-auto
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            reports/e2e-results.json
            reports/e2e-html/
          retention-days: 7

  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scale check-build (same object cache as package builds)
        run: node tools/build/build.mjs examples/x64-scale --check
      - name: Native reference compilation (outside the unchanged 120s test deadline)
        run: node tools/build/native-scale.mjs
      - name: Scale native checksum and unchanged chunk/cache unit assertions
        run: npm test -- tests/unit/build-chunks.test.ts --maxWorkers=1
      - name: Scale browser assertions (software WebGL 2)
        run: BGT_E2E_SCALE_ONLY=1 BGT_SOFTWARE_RENDERER=1 BGT_RESULTS_PREFIX=e2e-scale npx playwright test tests/e2e/x64-scale.spec.ts --project=chromium-webgl2
      - name: Scale differential oracle — 300 frames
        run: npm run oracle -- examples/x64-scale 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-report
          path: |
            reports/e2e-scale-results.json
            reports/e2e-scale-html/
            reports/oracle-x64-scale.json
          retention-days: 7

  gate:
    if: always()
    needs: [lint_js, lint_native, lint_examples, unit_1, unit_2, e2e, scale]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required CI aggregate — failures and skips are fatal
        env:
          LINT_JS: ${{ needs.lint_js.result }}
          UNIT1: ${{ needs.unit_1.result }}
          UNIT2: ${{ needs.unit_2.result }}
          LINT_NATIVE: ${{ needs.lint_native.result }}
          LINT_EXAMPLES: ${{ needs.lint_examples.result }}
          E2E: ${{ needs.e2e.result }}
          SCALE: ${{ needs.scale.result }}
        run: |
          printf 'lint_js=%s lint_native=%s lint_examples=%s unit_1=%s unit_2=%s e2e=%s scale=%s\n' "$LINT_JS" "$LINT_NATIVE" "$LINT_EXAMPLES" "$UNIT1" "$UNIT2" "$E2E" "$SCALE"
          test "$LINT_JS" = success && test "$LINT_NATIVE" = success && test "$LINT_EXAMPLES" = success && test "$UNIT1" = success && test "$UNIT2" = success && test "$E2E" = success && test "$SCALE" = success

  webgpu:
    if: github.event_name == 'workflow_dispatch' && inputs.webgpu
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: npm ci && npx playwright install chromium
      - run: npm run test:e2e:webgpu
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-e2e-report
          path: |
            reports/e2e-results.json
            reports/e2e-html/
          retention-days: 7
